[package]
name = "connector"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["form", "http2", "macros", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
http = "1.3"
libc = "0.2"
rand = "0.9"
regex = "1.12"
rmcp = { version = "3.1.4", features = ["client", "server", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "connector-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "connector-client"
path = "src/bin/client.rs"
