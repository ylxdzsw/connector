name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test all targets
        run: cargo test --all-targets --locked

  windows-client:
    name: Windows client
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check client
        run: cargo check --locked --target x86_64-pc-windows-msvc --lib --bin connector-client
      - name: Lint client
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --lib --bin connector-client -- -D warnings
      - name: Test client
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib --bin connector-client
      - name: Build release client
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin connector-client
      - name: Upload release client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-client-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/connector-client.exe
          if-no-files-found: error
