map $http_upgrade $connector_connection_upgrade {
    default upgrade;
    '' close;
}

upstream connector_backend {
    server unix:/run/connector/.gateway.sock;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name connector.ylxdzsw.com;

    ssl_certificate /etc/nginx/ssl/ylxdzsw.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ylxdzsw.com.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    error_page 403 =200 /login.html;

    location = /login.html {
        internal;
        root /var/www;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        if ($nginx_auth_ok = 0) { return 403; }
        include /etc/nginx/connector-proxy-headers.conf;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_backend;
    }

    location = /clients {
        if ($nginx_auth_ok = 0) { return 403; }
        include /etc/nginx/connector-proxy-headers.conf;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_backend;
    }

    location ^~ /clients/ {
        if ($nginx_auth_ok = 0) { return 403; }
        include /etc/nginx/connector-proxy-headers.conf;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_backend;
    }

    location ^~ /grants/ {
        if ($nginx_auth_ok = 0) { return 403; }
        include /etc/nginx/connector-proxy-headers.conf;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_backend;
    }

    location = /oauth/authorize {
        if ($nginx_auth_ok = 0) { return 403; }
        include /etc/nginx/connector-proxy-headers.conf;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_backend;
    }

    location = /mcp {
        include /etc/nginx/connector-proxy-headers.conf;
        proxy_set_header X-Connector-Subject "";
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_pass http://connector_backend;
    }

    location = /link {
        include /etc/nginx/connector-proxy-headers.conf;
        proxy_set_header X-Connector-Subject "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connector_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://connector_backend;
    }

    location / {
        include /etc/nginx/connector-proxy-headers.conf;
        proxy_set_header X-Connector-Subject "";
        proxy_pass http://connector_backend;
    }
}
