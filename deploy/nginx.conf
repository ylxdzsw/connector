map $http_upgrade $connector_upgrade {
    default upgrade;
    '' close;
}

upstream connector_gateway {
    server 127.0.0.1:3000;
}

server {
    listen 443 ssl http2;
    server_name connector.example.com;

    # Configure ssl_certificate, ssl_certificate_key, and the existing cookie gate.

    location = / {
        auth_request /_existing_cookie_auth;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_gateway;
    }

    location ^~ /clients {
        auth_request /_existing_cookie_auth;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_gateway;
    }

    location ^~ /grants {
        auth_request /_existing_cookie_auth;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_gateway;
    }

    location = /oauth/authorize {
        auth_request /_existing_cookie_auth;
        proxy_set_header X-Connector-Subject owner;
        proxy_pass http://connector_gateway;
    }

    location / {
        proxy_set_header X-Connector-Subject "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connector_upgrade;
        proxy_http_version 1.1;
        proxy_read_timeout 3700s;
        proxy_buffering off;
        proxy_pass http://connector_gateway;
    }
}
